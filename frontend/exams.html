<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إتقان</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%237c4dff'/><text x='50' y='70' font-family='Arial' font-size='58' font-weight='800' fill='white' text-anchor='middle'>إ</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/boot.js"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="topbar" id="topbar"></header>

        <div class="container stack">

            <section class="grid grid-4" id="stats">
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
            </section>

            <div class="layout-main-side equal">

                <section class="card">
                    <div class="card-head">
                        <div>
                            <span class="eyebrow" data-i18n="examsEyebrow"></span>
                            <h2 data-i18n="availableExams"></h2>
                        </div>
                    </div>
                    <div class="list" id="exams">
                        <div class="skeleton row"></div>
                        <div class="skeleton row"></div>
                        <div class="skeleton row"></div>
                    </div>
                </section>

                <section class="card card-column">
                    <div class="card-head">
                        <div>
                            <span class="eyebrow" data-i18n="examsSubtitle"></span>
                            <h2 data-i18n="historyTitle"></h2>
                        </div>
                    </div>
                    <div class="list" id="history">
                        <div class="skeleton row"></div>
                        <div class="skeleton row"></div>
                    </div>
                </section>

            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/exams.js"></script>
</body>
</html>
