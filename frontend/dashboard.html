<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إتقان</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23f4b860'/><text x='50' y='70' font-family='Arial' font-size='58' font-weight='800' fill='%2318212f' text-anchor='middle'>إ</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/boot.js"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="topbar" id="topbar"></header>

        <div class="container stack">

            <!-- Welcome + next lesson -->
            <section class="welcome">
                <div class="welcome-text">
                    <span class="welcome-date" id="today"></span>
                    <h2 id="greeting"></h2>
                    <p id="summary"></p>
                </div>
                <div class="next-lesson" id="nextLesson">
                    <div class="skeleton fill"></div>
                </div>
            </section>

            <!-- Key numbers -->
            <section class="grid grid-4" id="stats">
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
            </section>

            <div class="layout-main-side equal">

                <!-- Subjects -->
                <section class="card">
                    <div class="card-head">
                        <div>
                            <span class="eyebrow" data-i18n="subjectsEyebrow"></span>
                            <h2 data-i18n="subjectsTitle"></h2>
                        </div>
                        <a href="progress.html" class="link" data-i18n="viewDetails"></a>
                    </div>
                    <div class="subject-grid" id="subjects">
                        <div class="skeleton row"></div>
                        <div class="skeleton row"></div>
                        <div class="skeleton row"></div>
                        <div class="skeleton row"></div>
                    </div>
                </section>

                <!-- Recent activity -->
                <section class="card card-column">
                    <div class="card-head">
                        <div>
                            <span class="eyebrow" data-i18n="activityEyebrow"></span>
                            <h2 data-i18n="recentActivity"></h2>
                        </div>
                    </div>
                    <div class="timeline" id="activity">
                        <div class="skeleton row"></div>
                    </div>
                </section>

            </div>

            <!-- Suggested exams -->
            <section class="card">
                <div class="card-head">
                    <div>
                        <span class="eyebrow" data-i18n="examsEyebrow"></span>
                        <h2 data-i18n="suggestedExams"></h2>
                    </div>
                    <a href="exams.html" class="link" data-i18n="viewAll"></a>
                </div>
                <div class="grid grid-3" id="exams">
                    <div class="skeleton row"></div>
                    <div class="skeleton row"></div>
                    <div class="skeleton row"></div>
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/dashboard.js"></script>
</body>
</html>
