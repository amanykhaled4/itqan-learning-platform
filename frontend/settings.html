<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إتقان</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23f4b860'/><text x='50' y='70' font-family='Arial' font-size='58' font-weight='800' fill='%2318212f' text-anchor='middle'>إ</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/boot.js"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="topbar" id="topbar"></header>

        <div class="container stack">

            <section class="card">
                <div class="card-head">
                    <div>
                        <span class="eyebrow" data-i18n="settingsEyebrow"></span>
                        <h2 data-i18n="settingsTitle"></h2>
                    </div>
                </div>

                <div class="setting">
                    <div class="setting-info">
                        <span class="tile blue"><i class="fa-solid fa-language"></i></span>
                        <div><strong data-i18n="languageSetting"></strong><span data-i18n="languageText"></span></div>
                    </div>
                    <div class="segmented" id="languageChoice">
                        <button type="button" data-value="ar">العربية</button>
                        <button type="button" data-value="en">English</button>
                    </div>
                </div>

                <div class="setting">
                    <div class="setting-info">
                        <span class="tile purple"><i class="fa-solid fa-circle-half-stroke"></i></span>
                        <div><strong data-i18n="themeSetting"></strong><span data-i18n="themeText"></span></div>
                    </div>
                    <div class="segmented" id="themeChoice">
                        <button type="button" data-value="light"><i class="fa-solid fa-sun"></i><span data-i18n="light"></span></button>
                        <button type="button" data-value="dark"><i class="fa-solid fa-moon"></i><span data-i18n="dark"></span></button>
                    </div>
                </div>

                <div class="setting">
                    <div class="setting-info">
                        <span class="tile gold"><i class="fa-solid fa-bell"></i></span>
                        <div><strong data-i18n="notificationsSetting"></strong><span data-i18n="notificationsText"></span></div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="notifications" data-i18n-label="notificationsSetting">
                        <span></span>
                    </label>
                </div>

                <div class="setting">
                    <div class="setting-info">
                        <span class="tile green"><i class="fa-solid fa-clock"></i></span>
                        <div><strong data-i18n="reminderSetting"></strong><span data-i18n="reminderText"></span></div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="reminder" data-i18n-label="reminderSetting">
                        <span></span>
                    </label>
                </div>
            </section>

            <div class="actions">
                <button type="button" class="btn btn-primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i><span data-i18n="save"></span></button>
                <button type="button" class="btn btn-outline" id="resetBtn"><i class="fa-solid fa-rotate-left"></i><span data-i18n="resetSettings"></span></button>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/settings.js"></script>
</body>
</html>
