<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إتقان</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%237c4dff'/><text x='50' y='70' font-family='Arial' font-size='58' font-weight='800' fill='white' text-anchor='middle'>إ</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/boot.js"></script>
</head>
<body>
    <div class="auth-page">

        <aside class="auth-side">
            <div class="brand">
                <span class="brand-icon" data-i18n="brandIcon">إ</span>
                <span><strong data-i18n="brandName"></strong><small data-i18n="brandTagline"></small></span>
            </div>

            <div>
                <h1><span data-i18n="authHeadline1"></span><br><span data-i18n="authHeadline2"></span> <i class="fa-solid fa-star"></i></h1>
                <p data-i18n="authText"></p>
                <ul class="features">
                    <li><i class="fa-solid fa-check"></i><span data-i18n="feature1"></span></li>
                    <li><i class="fa-solid fa-check"></i><span data-i18n="feature2"></span></li>
                    <li><i class="fa-solid fa-check"></i><span data-i18n="feature3"></span></li>
                </ul>
            </div>

            <small data-i18n="authFooter"></small>
        </aside>

        <main class="auth-main">
            <div class="auth-tools">
                <button type="button" class="icon-btn" id="langBtn" data-i18n-label="switchLanguage"><i class="fa-solid fa-language"></i></button>
                <button type="button" class="icon-btn" id="themeBtn" data-i18n-label="toggleTheme"><i class="fa-solid fa-moon"></i></button>
            </div>

            <div class="auth-card">
                <div class="auth-card-head">
                    <h2 data-i18n="registerTitle"></h2>
                    <p data-i18n="registerSubtitle"></p>
                </div>

                <form id="registerForm" novalidate>
                    <div class="form-error" id="formError" role="alert"></div>

                    <div class="field">
                        <label for="fullName" data-i18n="fullName"></label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-user"></i>
                            <input class="input" type="text" id="fullName" maxlength="80" autocomplete="name" data-i18n-placeholder="fullNamePlaceholder">
                        </div>
                    </div>

                    <div class="field">
                        <label for="email" data-i18n="email"></label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-envelope"></i>
                            <input class="input" type="email" id="email" maxlength="120" autocomplete="email" data-i18n-placeholder="emailPlaceholder" dir="ltr">
                        </div>
                    </div>

                    <div class="field">
                        <label for="grade" data-i18n="grade"></label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <select class="select" id="grade">
                                <option value="" data-i18n="gradePlaceholder"></option>
                                <option value="الأول الثانوي"></option>
                                <option value="الثاني الثانوي"></option>
                                <option value="الثالث الثانوي"></option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-2">
                        <div class="field">
                            <label for="password" data-i18n="password"></label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-lock"></i>
                                <input class="input" type="password" id="password" autocomplete="new-password" data-i18n-placeholder="passwordPlaceholder">
                            </div>
                        </div>

                        <div class="field">
                            <label for="confirmPassword" data-i18n="confirmPassword"></label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-lock"></i>
                                <input class="input" type="password" id="confirmPassword" autocomplete="new-password" data-i18n-placeholder="confirmPasswordPlaceholder">
                            </div>
                        </div>
                    </div>

                    <label class="checkbox">
                        <input type="checkbox" id="terms">
                        <span data-i18n="terms"></span>
                    </label>

                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                        <span data-i18n="register"></span><i class="fa-solid fa-arrow-left flip-ltr"></i>
                    </button>
                </form>

                <p class="auth-switch">
                    <span data-i18n="haveAccount"></span>
                    <a href="index.html" data-i18n="signIn"></a>
                </p>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/auth.js"></script>
</body>
</html>
