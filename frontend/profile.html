<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إتقان</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%237c4dff'/><text x='50' y='70' font-family='Arial' font-size='58' font-weight='800' fill='white' text-anchor='middle'>إ</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/boot.js"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="topbar" id="topbar"></header>

        <div class="container stack">

            <section class="card profile-head" id="profileHead">
                <div class="skeleton row fill"></div>
            </section>

            <section class="grid grid-4" id="stats">
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
                <div class="skeleton row"></div>
            </section>

            <div class="grid grid-2">

                <!-- Edit details -->
                <section class="card">
                    <div class="card-head">
                        <div>
                            <span class="eyebrow" data-i18n="accountInfo"></span>
                            <h2 data-i18n="editProfile"></h2>
                        </div>
                    </div>
                    <form class="stack" id="profileForm" novalidate>
                        <div class="form-error" id="profileError" role="alert"></div>
                        <div class="field">
                            <label for="fullName" data-i18n="fullName"></label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-user"></i>
                                <input class="input" id="fullName" maxlength="80" autocomplete="name">
                            </div>
                        </div>
                        <div class="field">
                            <label for="email" data-i18n="email"></label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-envelope"></i>
                                <input class="input" id="email" disabled dir="ltr">
                            </div>
                        </div>
                        <div class="field">
                            <label for="grade" data-i18n="grade"></label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-graduation-cap"></i>
                                <select class="select" id="grade">
                                    <option value="الأول الثانوي"></option>
                                    <option value="الثاني الثانوي"></option>
                                    <option value="الثالث الثانوي"></option>
                                </select>
                            </div>
                        </div>
                        <div class="actions">
                            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i><span data-i18n="save"></span></button>
                        </div>
                    </form>
                </section>

                <!-- Change password -->
                <section class="card">
                    <div class="card-head">
                        <div>
                            <span class="eyebrow" data-i18n="accountInfo"></span>
                            <h2 data-i18n="changePassword"></h2>
                        </div>
                    </div>
                    <form class="stack" id="passwordForm" novalidate>
                        <div class="form-error" id="passwordError" role="alert"></div>
                        <div class="field">
                            <label for="currentPassword" data-i18n="currentPassword"></label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-lock"></i>
                                <input class="input" type="password" id="currentPassword" autocomplete="current-password">
                            </div>
                        </div>
                        <div class="field">
                            <label for="newPassword" data-i18n="newPassword"></label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-key"></i>
                                <input class="input" type="password" id="newPassword" autocomplete="new-password">
                            </div>
                        </div>
                        <div class="field">
                            <label for="confirmPassword" data-i18n="confirmPassword"></label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-key"></i>
                                <input class="input" type="password" id="confirmPassword" autocomplete="new-password">
                            </div>
                        </div>
                        <div class="actions">
                            <button type="submit" class="btn btn-outline"><i class="fa-solid fa-shield-halved"></i><span data-i18n="updatePassword"></span></button>
                        </div>
                    </form>
                </section>

            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/profile.js"></script>
</body>
</html>
